databases:
  - name: homebase-db
    databaseName: homebase
    user: homebase
    plan: free
    region: oregon
    postgresMajorVersion: "18"

services:
  - type: web
    name: homebase
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run db:deploy && npm run start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: 24.21.0
      - key: DATABASE_URL
        fromDatabase:
          name: homebase-db
          property: connectionString
